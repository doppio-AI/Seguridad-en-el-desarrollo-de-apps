server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: vulnerableapp
    static_configs:
      - targets:
          - localhost
        labels:
          job: vulnerableapp
          app: VulnerableApp
          __path__: /var/log/vulnerableapp/*.txt
    pipeline_stages:
      - regex:
          expression: '(?P<is_security>Evento de autenticaci.n)|(?P<is_audit>Comentario agregado|resultados encontrados|LOGIN EXITOSO|LOGIN FALLIDO|LOGOUT)'
      - template:
          source: category
          template: '{{ if .is_security }}Security{{ else if .is_audit }}Audit{{ else }}General{{ end }}'
      - labels:
          category:
